# pnpm >=10 reads overrides from here, not from package.json's "pnpm" field.
# Keep pins tight where advisories need a floor (see pnpm audit); lanes
# (pkg@major) pin only that semver lane without touching other majors.
#
# strictDepBuilds false + ignoredBuiltDependencies: msw/unrs-resolver ship
# postinstall scripts we deliberately don't run (dev-tool binaries); pnpm
# 12.14's default strict mode turns the skip into a fatal CI error.
strictDepBuilds: false
ignoredBuiltDependencies:
  - msw
  - unrs-resolver
overrides:
  mermaid: ^11.16.1
  hono: ^4.13.11
  dompurify: ^3.4.13
  postcss: ^8.5.23
  fast-uri@3: ^3.1.6
  ip-address@10: 10.7.4
  nanoid@3: ^3.3.16
  nanoid@4: ^5.1.16
  js-yaml@4: ^4.3.2
  katex: ^0.18.2
  postcss-selector-parser: ^7.1.6
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  path-to-regexp@8: ^8.4.0
  lodash-es: ^4.18.1
  flatted: ^3.4.2
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  body-parser: ^2.4.0
  eslint-plugin-react-hooks: 7.0.1
  "@babel/core": ^7.29.6
  "@modelcontextprotocol/sdk": ^1.31.0
  "@hono/node-server": ^1.19.15
  sharp: ^0.35.4
  browserslist: ^4.28.7
  qs: ^6.16.0
  baseline-browser-mapping: ^2.11.0
  "@humanfs/node": ^0.16.8
