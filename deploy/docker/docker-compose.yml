##
## Fluctio — single-machine deployment with Postgres.
##
## Quick start:
##   docker compose up -d
##   open http://localhost:18953        # walks the onboard wizard:
##                                       # super-admin account + first
##                                       # provider + first agent
##
## Or initialize from CLI without opening the web UI:
##   docker compose exec fluctio fluctio admin create-user \
##     --username alice --email alice@example.com --password 'hunter2' \
##     --role super_admin
##
## All runtime config goes through FLUCTIO_* env vars — no config file.
##
services:
  fluctio:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: fluctio/fluctio:latest
    restart: unless-stopped
    ports:
      - "${FLUCTIO_PORT:-18953}:18953"
    # Run as root to read /var/run/docker.sock (root:root 0660 is the
    # dockerd default). If your host socket is group-owned, switch to
    # group_add: ["docker"] and drop this line instead.
    user: root
    volumes:
      # Sandbox (sibling-container): the gateway spawns sandbox
      # containers as peers on the HOST daemon, so dockerd must be
      # reachable from inside this container. Needs docker-cli in the
      # image (see Dockerfile) + the socket mounted here.
      - /var/run/docker.sock:/var/run/docker.sock
      # ⚠️ IDENTICAL host/container path: sandbox passes this path
      # verbatim to `docker create -v`, so host dockerd must resolve it.
      # Override FLUCTIO_DATA_DIR in .env with an ABSOLUTE host path.
      - ${FLUCTIO_DATA_DIR:-/var/lib/fluctio}:${FLUCTIO_DATA_DIR:-/var/lib/fluctio}
    environment:
      # Server default timezone (IANA name). This is the LAST fallback in
      # the chain chatter pref → agent default → system default → TZ —
      # without it the container runs UTC and agents whose chatters never
      # set a timezone get UTC wall clocks and UTC-fired schedules.
      TZ: "${TZ:-Asia/Shanghai}"
      # FLUCTIO_HOME — MUST equal the container side of the bind mount
      # above (sibling-container pattern). Default /var/lib/fluctio.
      FLUCTIO_HOME: ${FLUCTIO_DATA_DIR:-/var/lib/fluctio}
      # Bind to all interfaces so the host port mapping works
      FLUCTIO_BIND: all
      FLUCTIO_PORT: "18953"
      # Postgres backend (sqlite would also work; use it by clearing
      # these two and removing the postgres service below)
      FLUCTIO_STORAGE_TYPE: postgres
      FLUCTIO_STORAGE_DSN: "postgres://fluctio:${POSTGRES_PASSWORD:-fluctio-secret}@postgres:5432/fluctio?sslmode=disable"
      FLUCTIO_STORAGE_AUTO_MIGRATE: "true"
      # ─── Sandbox ────────────────────────────────────────────────────
      # Real values live in .env (gitignored); see .env.example.
      FLUCTIO_SANDBOX_ENABLED: "true"
      FLUCTIO_SANDBOX_BACKEND: docker
      # ghcr.io/fluctio-ai/fluctio-sandbox:latest ships Python3 + Node + Camoufox
      # + git/curl. Override via FLUCTIO_SANDBOX_IMAGE in .env.
      FLUCTIO_SANDBOX_IMAGE: ${FLUCTIO_SANDBOX_IMAGE:-ghcr.io/fluctio-ai/fluctio-sandbox:latest}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["gateway"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluctio
      POSTGRES_USER: fluctio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluctio-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluctio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
