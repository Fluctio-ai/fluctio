# Optional — in-cluster self-hosted Postgres, suitable for dev / single-node trials.
# For production, prefer a managed service (Aliyun RDS / AWS RDS / etc.) and
# point fluctio.yaml's fluctio-secrets.STORAGE_DSN at it; this file is not needed.
#
# To use alongside fluctio.yaml:
#   1. kubectl apply -f postgres.yml          (creates the resources below)
#   2. In fluctio.yaml, set fluctio-secrets.STORAGE_DSN to:
#        postgres://fluctio:<POSTGRES_PASSWORD above>@fluctio-db:5432/fluctio?sslmode=disable
#   3. kubectl apply -f fluctio.yaml
apiVersion: v1
kind: Secret
metadata:
  name: fluctio-db
  namespace: fluctio
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluctio-db
  namespace: fluctio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluctio-db
  namespace: fluctio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluctio-db
  template:
    metadata:
      labels:
        app: fluctio-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: fluctio
        - name: POSTGRES_USER
          value: fluctio
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluctio-db
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "fluctio"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fluctio-db
---
apiVersion: v1
kind: Service
metadata:
  name: fluctio-db
  namespace: fluctio
spec:
  selector:
    app: fluctio-db
  ports:
  - port: 5432
